<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar contraseña</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .caja {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #ec4a0a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="caja">

    <h1>NUEVA CONTRASEÑA</h1>

    <input
        type="password"
        id="nuevaPassword"
        placeholder="Nueva contraseña"
    >

    <input
        type="password"
        id="confirmarPassword"
        placeholder="Confirmar contraseña"
    >

    <button onclick="cambiarPassword()">
        CAMBIAR CONTRASEÑA
    </button>

    <p id="mensaje"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://yuivmqncvmsbtiigxsqt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r1ZMaIIEVcAt26_P-FBu9Q_DUenqDH_";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function cambiarPassword() {

    const password =
        document.getElementById("nuevaPassword").value;

    const confirmar =
        document.getElementById("confirmarPassword").value;

    const mensaje =
        document.getElementById("mensaje");


    if (!password || !confirmar) {

        mensaje.textContent =
            "Completa los dos campos.";

        mensaje.style.color = "red";

        return;
    }


    if (password !== confirmar) {

        mensaje.textContent =
            "Las contraseñas no coinciden.";

        mensaje.style.color = "red";

        return;
    }


    if (password.length < 6) {

        mensaje.textContent =
            "La contraseña debe tener mínimo 6 caracteres.";

        mensaje.style.color = "red";

        return;
    }


    mensaje.textContent =
        "Cambiando contraseña...";

    mensaje.style.color = "#333";


    const {
        data,
        error
    } =
    await supabaseClient.auth.updateUser({

        password: password

    });


    if (error) {

        console.error(error);

        mensaje.textContent =
            "No se pudo cambiar la contraseña: " +
            error.message;

        mensaje.style.color = "red";

        return;
    }


    mensaje.textContent =
        "✅ Contraseña cambiada correctamente.";

    mensaje.style.color = "green";


    setTimeout(() => {

        window.location.href =
            "admin-login.html";

    }, 1500);

}

</script>

</body>
</html>
