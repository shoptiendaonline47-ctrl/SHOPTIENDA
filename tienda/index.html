<link rel="stylesheet"

<style>

/* =====================================================
   PRODUCTOS
===================================================== */

.contenido-cliente {
    padding-top: 4px;
}


/* =====================================================
   OFERTA / SORTEO
===================================================== */

.contenedor-botones-producto {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 5px;
    width: 100%;
    box-sizing: border-box;
}

.etiqueta-oferta-cliente,
.etiqueta-sorteo-cliente {
    box-sizing: border-box;
    flex: 1;
    min-width: 0;

    padding: 7px 13px;
    margin-top: 7px;
    border-radius: 6px;

    color: white;
    font-size: 11px;
    font-weight: bold;

    text-align: center;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    white-space: nowrap;

    cursor: default;
}

.etiqueta-oferta-cliente {
    background: #f57c00;
}

.etiqueta-sorteo-cliente {
    background: #28a745;
}


/* =====================================================
   REACCIÓN
===================================================== */

#btnCalificar {

    cursor: pointer;

    transition:
        transform 0.15s ease;

    border: none;

    background: transparent;

    font-size: 28px;

    padding: 5px 10px;

    line-height: 1;

}

#btnCalificar.corazon-latiendo {

    animation:
        latidoCorazon 0.45s ease;

}

@keyframes latidoCorazon {

    0% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.45);
    }

    55% {
        transform: scale(1.15);
    }

    75% {
        transform: scale(1.35);
    }

    100% {
        transform: scale(1);
    }


    
}

/* =====================================================
   RULETA
===================================================== */

#fondoRuleta {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.70);

    z-index: 19998;

}


#ventanaRuletaCliente {

    display: none;

    position: fixed;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 94%;

    max-width: 560px;

    max-height: 94vh;

    overflow-y: auto;

    background: white;

    border-radius: 20px;

    padding: 20px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,0.40);

    z-index: 19999;

    text-align: center;

    margin: 0;

}


.encabezado-ruleta-cliente {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom: 10px;

}


.encabezado-ruleta-cliente h2 {

    margin: 0;

    font-size: 22px;

    color: #222;

}


#btnCerrarRuletaCliente {

    border: none;

    background: #dc2626;

    color: white;

    width: 34px;

    height: 34px;

    border-radius: 50%;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}


.texto-ruleta {

    margin: 5px 0 15px;

    font-size: 14px;

    color: #555;

}


.contenedor-ruleta-circular {

    position: relative;

    width:
        min(86vw, 420px);

    height:
        min(86vw, 420px);

    max-width: 420px;

    max-height: 420px;

    margin:
        10px auto 20px;

}


#canvasRuleta {

    width: 100%;

    height: 100%;

    display: block;

    border-radius: 50%;

    transform:
        rotate(0deg);

    transition:
        transform 5s
        cubic-bezier(
            0.12,
            0.72,
            0.12,
            1
        );

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.25);

}


.puntero-ruleta {

    position: absolute;

    top: -5px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 0;

    height: 0;

    border-left:
        18px solid transparent;

    border-right:
        18px solid transparent;

    border-top:
        35px solid #dc2626;

    z-index: 10;

    filter:
        drop-shadow(
            0 2px 2px
            rgba(0,0,0,0.30)
        );

}


.centro-ruleta {

    position: absolute;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 70px;

    height: 70px;

    background: white;

    border:
        7px solid #ff7a00;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

    z-index: 5;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.25);

    width: 90%;

    max-width: 350px;

    border: none;

    border-radius: 10px;

    padding: 13px;

    background: #16a34a;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

#btnGirarRuleta:hover {

        scale(1.03);

}


#btnGirarRuleta:disabled {

#resultadoRuleta {

    padding: 10px;

    border-radius: 10px;

    font-size: 15px;

#detallePremioRuleta {

#detallePremioRuleta p {

    border:

</style>

/* =====================================================
   OBTENER FECHA DEL PRODUCTO
===================================================== */

function obtenerFechaProducto(
    producto
) {

    if (!producto) {

        return 0;

    }


    const posiblesFechas = [

        producto.creado_en,

        producto.creadoEn,

        producto.fecha_creacion,

        producto.fechaCreacion,

        producto.fecha_publicacion,

        producto.fechaPublicacion,

        producto.created_at,

        producto.createdAt

    ];


    for (
        let i = 0;
        i < posiblesFechas.length;
        i++
    ) {

        if (
            posiblesFechas[i] !== undefined &&
            posiblesFechas[i] !== null &&
            posiblesFechas[i] !== ""
        ) {

            const fecha =
                new Date(
                    posiblesFechas[i]
                ).getTime();


            if (!isNaN(fecha)) {

                return fecha;

            }

        }

    }


    return 0;

}



/* =====================================================
   PREPARAR WHATSAPP
===================================================== */

function prepararNumeroWhatsApp(
    numero
) {

    if (!numero) {

        return "";

    }


    numero =
        String(numero).trim();


    numero =
        numero.replace(
            /\D/g,
            ""
        );


    if (
        numero.startsWith("51")
    ) {

        return numero;

    }


    if (
        numero.length === 9
    ) {

        return "51" + numero;

    }


    return numero;

}

function obtenerNombrePremio(
    premio,
    numero
) {

    if (!premio) {

        return "PREMIO " +
            numero;

    }


    return (
        premio.nombre ||

        "PREMIO " +
        numero
    );

}



/* =====================================================
   IMAGEN RULETA
===================================================== */

function cargarImagenRuleta(
    src
) {

    return new Promise(
        function(resolve) {

            if (!src) {

                resolve(null);

                return;

            }


            const imagen =
                new Image();


            imagen.onload =
                function() {

                    resolve(
                        imagen
                    );

                };


            imagen.onerror =
                function() {

                    resolve(null);

                };


            imagen.src =
                src;

        }
    );

}



/* =====================================================
   DIBUJAR RULETA
===================================================== */

async function dibujarRuleta() {

    const canvas =
        document.getElementById(
            "canvasRuleta"
        );


    if (!canvas) {

        return;

    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    const centroX =
        canvas.width / 2;


    const centroY =
        canvas.height / 2;


    const radio =
        285;


    const cantidad =
        4;


    const angulo =
        (
            Math.PI * 2
        ) /
        cantidad;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const colores = [

        "#ff7a00",

        "#2563eb",

        "#16a34a",

        "#dc2626"

    ];


    const imagenesPremios = [];


    for (
        let i = 0;
        i < cantidad;
        i++
    ) {

        const premio =
            premiosRuleta[i] || {};


        let src = "";


        if (
            typeof premio.imagen ===
            "string"
        ) {

            src =
                premio.imagen.trim();

        }


        if (!src) {

            const original =
                premio.original || {};


            const producto =
                premio.producto ||
                premio.product ||
                premio.item ||
                {};


            src =
                original.imagen ||
                original.image ||
                original.foto ||
                original.foto_producto ||
                original.imagen_producto ||
                original.url_imagen ||
                original.urlImagen ||
                original.image_url ||
                original.imageUrl ||
                producto.imagen ||
                producto.image ||
                producto.foto ||
                producto.foto_producto ||
                producto.imagen_producto ||
                producto.url_imagen ||
                producto.urlImagen ||
                producto.image_url ||
                producto.imageUrl ||
                "";

        }


        if (src) {

            const imagen =
                await cargarImagenRuleta(
                    src
                );


            imagenesPremios[i] =
                imagen;

        }

        else {

            imagenesPremios[i] =
                null;

        }

    }



    for (
        let i = 0;
        i < cantidad;
        i++
    ) {

        const inicio =
            -Math.PI / 2 +
            i * angulo;


        const fin =
            inicio + angulo;


        const premio =
            premiosRuleta[i] || {

                numero:
                    i + 1,

                tipo:
                    "texto",

                nombre:
                    "PREMIO " +
                    (i + 1),

                texto:
                    "PREMIO " +
                    (i + 1),

                imagen:
                    ""

            };


        ctx.beginPath();


        ctx.moveTo(
            centroX,
            centroY
        );


        ctx.arc(
            centroX,
            centroY,
            radio,
            inicio,
            fin
        );


        ctx.closePath();


        ctx.fillStyle =
            colores[
                i %
                colores.length
            ];


        ctx.fill();


        ctx.strokeStyle =
            "#ffffff";


        ctx.lineWidth =
            7;


        ctx.stroke();


        const anguloCentro =
            inicio +
            angulo / 2;


        const contenidoX =
            centroX +
            Math.cos(
                anguloCentro
            ) * 175;


        const contenidoY =
            centroY +
            Math.sin(
                anguloCentro
            ) * 175;


        let texto =
            obtenerNombrePremio(
                premio,
                i + 1
            );


        if (
            texto.length > 18
        ) {

            texto =
                texto.substring(
                    0,
                    18
                ) +
                "...";

        }


        ctx.save();


        ctx.translate(
            contenidoX,
            contenidoY
        );


        ctx.rotate(
            anguloCentro
        );


        const imagen =
            imagenesPremios[i];


        if (imagen) {

            const tamañoImagen =
                115;


            ctx.beginPath();


            ctx.arc(
                0,
                -42,
                62,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.fill();


            ctx.strokeStyle =
                "#ffffff";


            ctx.lineWidth =
                4;


            ctx.stroke();


            ctx.save();


            ctx.beginPath();


            ctx.arc(
                0,
                -42,
                56,
                0,
                Math.PI * 2
            );


            ctx.clip();


            const proporcion =
                Math.min(
                    tamañoImagen /
                        imagen.width,

                    tamañoImagen /
                        imagen.height
                );


            const ancho =
                imagen.width *
                proporcion;


            const alto =
                imagen.height *
                proporcion;


            ctx.drawImage(
                imagen,
                -ancho / 2,
                -42 -
                    alto / 2,
                ancho,
                alto
            );


            ctx.restore();

        }


        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "bold 18px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.shadowColor =
            "rgba(0,0,0,0.50)";


        ctx.shadowBlur =
            4;


        ctx.shadowOffsetX =
            1;


        ctx.shadowOffsetY =
            1;


        ctx.fillText(
            texto,
            0,
            65
        );


        ctx.shadowColor =
            "transparent";


        ctx.restore();

    }


    ctx.beginPath();


    ctx.arc(
        centroX,
        centroY,
        radio,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        "#222";


    ctx.lineWidth =
        8;


    ctx.stroke();

}

    }


    if (detalle) {

        detalle.style.display =
            "none";

    }


    if (imagenResultado) {

        imagenResultado.style.display =
            "none";


        imagenResultado.removeAttribute(
            "src"
        );

    }


    if (boton) {

        boton.disabled =
            false;


        boton.textContent =
            "▶️ JUGAR";

    }


    await dibujarRuleta();

}



/* =====================================================
   CERRAR RULETA
===================================================== */

function cerrarRuletaCliente() {

    const ventana =
        document.getElementById(
            "ventanaRuletaCliente"
        );


    const fondo =
        document.getElementById(
            "fondoRuleta"
        );


    if (ventana) {

        ventana.style.display =
            "none";

    }


    if (fondo) {

        fondo.style.display =
            "none";

    }

}



/* =====================================================
   GIRAR RULETA
===================================================== */

function girarRuletaCliente() {

    if (ruletaGirando) {

        return;

    }


    if (!ruletaActivaCliente) {

        return;

    }


    const canvas =
        document.getElementById(
            "canvasRuleta"
        );


    const boton =
        document.getElementById(
            "btnGirarRuleta"
        );


    const resultado =
        document.getElementById(
            "resultadoRuleta"
        );


    const detalle =
        document.getElementById(
            "detallePremioRuleta"
        );


    const nombreResultado =
        document.getElementById(
            "nombrePremioResultado"
        );


    const descripcionResultado =
        document.getElementById(
            "descripcionPremioResultado"
        );


    const imagenResultado =
        document.getElementById(
            "imagenPremioResultado"
        );


    if (!canvas) {

        return;

    }


    ruletaGirando =
        true;


    if (boton) {

        boton.disabled =
            true;


        boton.textContent =
            "🎡 GIRANDO...";

    }


    if (detalle) {

        detalle.style.display =
            "none";

    }


    if (imagenResultado) {

        imagenResultado.style.display =
            "none";


        imagenResultado.removeAttribute(
            "src"
        );

    }


    const cantidad =
        premiosRuleta.length;


    const premioGanador =
        Math.floor(
            Math.random() *
            cantidad
        );


    const gradosPorPremio =
        360 /
        cantidad;


    const centroPremio =
        premioGanador *
        gradosPorPremio +
        gradosPorPremio / 2;


    const actual =
        (
            (
                rotacionRuleta %
                360
            ) + 360
        ) % 360;


    let ajuste =
        360 -
        centroPremio -
        actual;


    if (ajuste < 0) {

        ajuste +=
            360;

    }


    const vueltas =
        5 +
        Math.floor(
            Math.random() * 3
        );


    rotacionRuleta +=
        vueltas * 360 +
        ajuste;


    canvas.style.transform =
        "rotate(" +
        rotacionRuleta +
        "deg)";


    setTimeout(
        function() {

            ruletaGirando =
                false;


            const premio =
                premiosRuleta[
                    premioGanador
                ];


            const nombre =
                obtenerNombrePremio(
                    premio,
                    premioGanador + 1
                );


            const texto =
                premio &&
                premio.texto
                    ? premio.texto
                    : nombre;


            premioGanadoRuleta =
                nombre;


            try {

                sessionStorage.setItem(
                    "premioGanadoRuleta",
                    nombre
                );

            }

            catch(error) {}


            if (resultado) {

                resultado.textContent =
                    "🎉 ¡GANASTE: " +
                    nombre +
                    "!";

            }


            if (nombreResultado) {

                nombreResultado.textContent =
                    "🎁 " +
                    nombre;

            }


            if (descripcionResultado) {

                descripcionResultado.textContent =
                    premio &&
                    premio.descripcion
                        ? premio.descripcion
                        : texto;

            }


            let imagenPremio =
                "";


            if (premio) {

                const producto =
                    premio.producto ||
                    premio.product ||
                    premio.item ||
                    {};


                const original =
                    premio.original ||
                    {};


                imagenPremio =
                    premio.imagen ||
                    premio.image ||
                    premio.foto ||
                    premio.foto_producto ||
                    premio.imagen_producto ||
                    premio.url_imagen ||
                    premio.urlImagen ||
                    premio.image_url ||
                    premio.imageUrl ||
                    original.imagen ||
                    original.image ||
                    original.foto ||
                    original.foto_producto ||
                    original.imagen_producto ||
                    original.url_imagen ||
                    original.urlImagen ||
                    original.image_url ||
                    original.imageUrl ||
                    producto.imagen ||
                    producto.image ||
                    producto.foto ||
                    producto.foto_producto ||
                    producto.imagen_producto ||
                    producto.url_imagen ||
                    producto.urlImagen ||
                    producto.image_url ||
                    producto.imageUrl ||
                    "";

            }


            if (
                imagenResultado &&
                imagenPremio
            ) {

                imagenResultado.onload =
                    function() {

                        imagenResultado.style.display =
                            "block";

                    };


                imagenResultado.onerror =
                    function() {

                        console.error(
                            "No se pudo cargar la imagen del premio:",
                            imagenPremio
                        );


                        imagenResultado.style.display =
                            "none";

                    };


                imagenResultado.src =
                    imagenPremio;


                if (
                    imagenResultado.complete &&
                    imagenResultado.naturalWidth > 0
                ) {

                    imagenResultado.style.display =
                        "block";

                }

            }


            if (detalle) {

                detalle.style.display =
                    "block";

            }


            setTimeout(
                function() {

                    cerrarRuletaCliente();

                },
                3000
            );

        },
        5200
    );

}



/* =====================================================
   COMPROBAR RULETA
===================================================== */

async function comprobarEstadoRuleta() {

    const cargada =
        await cargarConfiguracionRuletaCliente();


    if (!cargada) {

        cerrarRuletaCliente();

        return;

    }


    if (ruletaActivaCliente) {

        await abrirRuletaCliente();

    }

    else {

        cerrarRuletaCliente();

    }

}



/* =====================================================
   ACTUALIZAR RULETA
===================================================== */

let intervaloRuletaSupabase =
    null;


function iniciarActualizacionRuleta() {

    if (intervaloRuletaSupabase) {

        clearInterval(
            intervaloRuletaSupabase
        );

    }


    intervaloRuletaSupabase =
        setInterval(
            async function() {

                try {

                    const estadoAnterior =
                        ruletaActivaCliente;


                    const cargada =
                        await cargarConfiguracionRuletaCliente();


                    if (!cargada) {

                        return;

                    }


                    if (
                        estadoAnterior !==
                        ruletaActivaCliente
                    ) {

                        if (
                            ruletaActivaCliente
                        ) {

                            await abrirRuletaCliente();

                        }

                        else {

                            cerrarRuletaCliente();

                        }

                    }


                    else if (
                        ruletaActivaCliente &&
                        !ruletaGirando
                    ) {

                        const ventana =
                            document.getElementById(
                                "ventanaRuletaCliente"
                            );


                        if (
                            ventana &&
                            ventana.style.display ===
                            "block"
                        ) {

                            await dibujarRuleta();

                        }

                    }

                }


                catch(error) {

                    console.error(
                        "Error actualizando ruleta:",
                        error
                    );

                }

            },
            5000
        );

}

/* =====================================================
   🎵 MÚSICA DEL CLIENTE
===================================================== */

let audioMusicaCliente = null;

let configuracionMusicaCliente = null;

let musicaClienteIniciada = false;

let intervaloMusicaCliente = null;

let ultimaConfiguracionMusicaCliente = "";


/* =====================================================
   DETENER MÚSICA
===================================================== */

function detenerMusicaCliente() {

    if (audioMusicaCliente) {

        audioMusicaCliente.pause();

        audioMusicaCliente.currentTime = 0;

        audioMusicaCliente.src = "";

        audioMusicaCliente = null;

    }

    musicaClienteIniciada = false;

}


/* =====================================================
   REPRODUCIR MÚSICA
===================================================== */
async function reproducirMusicaCliente() {

    if (
        !configuracionMusicaCliente ||
        configuracionMusicaCliente.activa !== true ||
        !configuracionMusicaCliente.url_musica
    ) {

        console.log(
            "🔴 No hay música activa o no existe URL."
        );

        return;

    }


    detenerMusicaCliente();


    const inicio =
        Number(
            configuracionMusicaCliente.segundo_inicio ?? 0
        );


    const final =
        Number(
            configuracionMusicaCliente.segundo_final ?? 60
        );


    const repetir =
        configuracionMusicaCliente.repeticion !== false;


    if (final <= inicio) {

        console.error(
            "❌ Fragmento inválido:",
            inicio,
            final
        );

        return;

    }


    console.log(
        "🎵 Intentando reproducir:",
        configuracionMusicaCliente.url_musica
    );


    const audio =
        new Audio(
            configuracionMusicaCliente.url_musica
        );


    audio.preload =
        "auto";


    audioMusicaCliente =
        audio;


    /* =================================================
       CUANDO TENEMOS LA DURACIÓN
    ================================================= */

    audio.addEventListener(
        "loadedmetadata",
        function() {

            if (
                !audioMusicaCliente ||
                audio !== audioMusicaCliente
            ) {

                return;

            }


            console.log(
                "🎵 Duración del audio:",
                audio.duration
            );


            if (
                final > audio.duration
            ) {

                console.error(
                    "❌ El segundo final supera la duración."
                );

                detenerMusicaCliente();

                return;

            }


            audio.currentTime =
                inicio;

        }
    );


    /* =================================================
       CONTROL DEL FRAGMENTO
    ================================================= */

    audio.addEventListener(
        "timeupdate",
        function() {

            if (
                !audioMusicaCliente ||
                audio !== audioMusicaCliente
            ) {

                return;

            }


            if (
                audio.currentTime >=
                final
            ) {

                if (repetir) {

                    audio.currentTime =
                        inicio;

                }

                else {

                    audio.pause();

                    audio.currentTime =
                        inicio;

                    musicaClienteIniciada =
                        false;

                }

            }

        }
    );


    /* =================================================
       IMPORTANTE:
       PLAY DIRECTAMENTE
       DURANTE LA INTERACCIÓN DEL USUARIO
    ================================================= */

    try {

        await audio.play();


        musicaClienteIniciada =
            true;


        console.log(
            "✅ MÚSICA REPRODUCIÉNDOSE"
        );

    }


    catch(error) {

        musicaClienteIniciada =
            false;


        console.error(
            "❌ EL NAVEGADOR BLOQUEÓ LA MÚSICA:",
            error
        );

    }

}

/* =====================================================
   CARGAR CONFIGURACIÓN DE MÚSICA
===================================================== */

async function cargarConfiguracionMusicaCliente() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from(
    "configuracion_musica"
)
.select("*")
.eq(
    "tienda_id",
    tiendaIdActual
)
.limit(1)
.maybeSingle();


        if (error) {

            console.error(
                "❌ Error cargando música:",
                error
            );

            return;

        }


        /* =================================================
           NO HAY CONFIGURACIÓN
        ================================================= */

        if (!data) {

            configuracionMusicaCliente =
                null;

            ultimaConfiguracionMusicaCliente =
                "sin-musica";

            detenerMusicaCliente();

            return;

        }


        /* =================================================
           IDENTIFICAR SI CAMBIÓ LA CONFIGURACIÓN
        ================================================= */

        const nuevaConfiguracion =
            JSON.stringify({

                activa:
                    data.activa === true,

                url_musica:
                    data.url_musica || "",

                segundo_inicio:
                    Number(
                        data.segundo_inicio ?? 0
                    ),

                segundo_final:
                    Number(
                        data.segundo_final ?? 60
                    ),

                repeticion:
                    data.repeticion !== false

            });


        const huboCambio =
            nuevaConfiguracion !==
            ultimaConfiguracionMusicaCliente;


        ultimaConfiguracionMusicaCliente =
            nuevaConfiguracion;


        /* =================================================
           GUARDAR CONFIGURACIÓN
        ================================================= */

        configuracionMusicaCliente =
            data;


        /* =================================================
           MÚSICA DESACTIVADA
        ================================================= */

        if (
            data.activa !== true ||
            !data.url_musica
        ) {

            detenerMusicaCliente();

            console.log(
                "🔴 Música del cliente desactivada."
            );

            return;

        }


        /* =================================================
           SI CAMBIÓ LA CONFIGURACIÓN
        ================================================= */

        if (huboCambio) {

            console.log(
                "🎵 Nueva configuración de música detectada."
            );


            await reproducirMusicaCliente();

        }

    }


    catch(error) {

        console.error(
            "❌ Error inesperado cargando música:",
            error
        );

    }

}


/* =====================================================
   INICIAR MÚSICA CON INTERACCIÓN DEL CLIENTE
===================================================== */

async function iniciarMusicaClientePorInteraccion() {

    if (
        musicaClienteIniciada
    ) {

        return;

    }


    if (
        !configuracionMusicaCliente ||
        configuracionMusicaCliente.activa !== true
    ) {

        return;

    }


    if (
        !configuracionMusicaCliente.url_musica
    ) {

        return;

    }


    await reproducirMusicaCliente();

}


/* =====================================================
   ACTUALIZAR MÚSICA CADA 5 SEGUNDOS
===================================================== */

function iniciarActualizacionMusicaCliente() {

    if (
        intervaloMusicaCliente
    ) {

        clearInterval(
            intervaloMusicaCliente
        );

    }


    intervaloMusicaCliente =
        setInterval(
            async function() {

                await cargarConfiguracionMusicaCliente();

            },
            5000
        );

}


/* =====================================================
   PRIMERA INTERACCIÓN DEL CLIENTE
===================================================== */
document.addEventListener(
    "pointerdown",
    iniciarMusicaClientePorInteraccion
);
document.addEventListener(
    "DOMContentLoaded",
    async function() {

        const tiendaValida =
            await cargarTiendaActual();

        if (!tiendaValida) {
            return;
        }

        await cargarConfiguracionCliente();

        await cargarProductosCliente();

        await comprobarEstadoRuleta();

        await cargarConfiguracionMusicaCliente();

        iniciarActualizacionConfiguracionCliente();

        iniciarActualizacionRuleta();

        iniciarActualizacionMusicaCliente();

    }
);

</script>
